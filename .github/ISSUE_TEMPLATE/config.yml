blank_issues_enabled: false
contact_links:
  - name: Bug or feature in COLDCARD firmware itself
    url: https://github.com/Coldcard/firmware/issues
    about: Anything not specific to the unified opt-in signature hash belongs upstream, where it reaches far more users.
  - name: Bug in Shrike
    url: https://github.com/privkeyio/shrike/issues
    about: Problems in the wallet that builds the PSBT rather than in the firmware.
  - name: Verifying a download
    url: https://github.com/privkeyio/cc-firmware/releases/latest
    about: Each release says how to check SHA256SUMS and the signature, and how to reproduce the build.
